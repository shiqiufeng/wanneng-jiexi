name: 万能解析
display_name: 万能解析
short_desc: 发个链接就自动解析视频 / 图集 / 音频的 AstrBot 插件；抖音、小红书、TikTok 实况图以 mp4 发送，内置主页作品清单、主页音乐提取、群相册收藏、短链服务与 B 站扫码登录。
desc: 一站式的消息链接解析插件：把受支持平台的分享链接发进会话，机器人自动抓取视频/图集/音频并渲染信息卡片回传。内置实况图（Live Photo）支持——抖音、小红书、TikTok 的实况会以 mp4 形式发送，同一张图的实况会替代其静态图（分段作品则实况与静态图各归其位）；快手（含极速版）暂无法取到实况视频，图集按静态图发送。命令体系覆盖音频单发、主页作品清单、主页音乐清单、群相册收藏、短链自检与 B 站扫码登录。支持平台：A站、B站、抖音、TikTok、小红书、快手、微博、油管、网易云、推特、Instagram、Iwara、Pixiv、QQ空间、微信视频号、小黑盒、知乎、NGA、CPP无差别同人站等。
help: 发送受支持的平台链接即可触发解析；实况（Live Photo）会以 mp4 发送并替代对应的静态图（当前支持抖音、小红书、TikTok；快手图集发静态图）。输入「/解析帮助」查看完整命令说明。命令一览：「/音乐 + 链接」只解析音频并发送，可用语音或文件形式发送（也可用参数强制，如「/音乐 文件 + 链接」）；「/全部 + 抖音主页链接」把该用户主页作品逐条渲染成卡片（头像/昵称/时间/标题/封面），并在同一转发节点内附上作品直链；「/全部音乐 + 抖音主页链接」把该用户主页全部作品的背景音乐逐条提取成音频直链，生成短链后以文本清单发送；「/开启解析」「/关闭解析」开关当前会话的解析；「/短链验证」自检短链服务是否可用；「/登录B站」扫码登录 B 站；「/相册少女集 + 链接」把解析出的图片和视频直接存进群相册（相册名见配置项「相册名称」，默认「少女集」），只回一条上传结果、不往群里发媒体，图片批量上传、视频单独上传，作品文案会写到相册评论里。以上清单与音频命令均支持可选的条数与发送方式参数，顺序不限：条数如「/全部 10 + 链接」（覆盖配置项的条数上限，最大 200）；发送方式可加「文件」或「语音」，如「/全部音乐 文件 10 + 主页链接」。直链在配置了短链服务（配置项「短链服务接口地址」「短链服务密码」）时会自动转成短链，短码按 36 进制由小到大递增，未配置则直接发送原始直链。所有命令的斜杠都可省略（「解析帮助」与「/解析帮助」等效），也不依赖面板「指令管理」里的指令开关，停用或改名都不会让命令失联。
