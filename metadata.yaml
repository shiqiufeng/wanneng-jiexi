name: 万能解析
display_name: 万能解析
short_desc: 发个链接就自动解析视频 / 图集 / 音频的 AstrBot 插件；抖音、小红书、TikTok 实况图以 mp4 发送，内置主页作品清单、主页音乐提取、主页作品整批存相册、群相册收藏与管理、短链服务与 B 站扫码登录。
desc: 一站式的消息链接解析插件：把受支持平台的分享链接发进会话，机器人自动抓取视频/图集/音频并渲染信息卡片回传。内置实况图（Live Photo）支持——抖音、小红书、TikTok 的实况会以 mp4 形式发送，同一张图的实况会替代其静态图（分段作品则实况与静态图各归其位）；快手（含极速版）暂无法取到实况视频，图集按静态图发送。命令体系覆盖音频单发、主页作品清单、主页音乐清单、主页作品整批存相册（一个作品一条）、群相册收藏与管理（可指定相册名，建/删相册带权限分级）、短链自检与 B 站扫码登录。支持平台：A站、B站、抖音、TikTok、小红书、快手、微博、油管、网易云、推特、Instagram、Iwara、Pixiv、QQ空间、微信视频号、小黑盒、知乎、NGA、CPP无差别同人站等。
help: 发送受支持的平台链接即可触发解析；实况（Live Photo）会以 mp4 发送并替代对应的静态图（当前支持抖音、小红书、TikTok；快手图集发静态图）。输入「/解析帮助」查看完整命令说明。命令一览：「/音乐 + 链接」只解析音频并发送，可用语音或文件形式发送（也可用参数强制，如「/音乐 文件 + 链接」）；「/全部 + 抖音主页链接」把该用户主页作品逐条渲染成卡片（头像/昵称/时间/标题/封面），并在同一转发节点内附上作品直链；「/全部音乐 + 抖音主页链接」把该用户主页全部作品的背景音乐逐条提取成音频直链，生成短链后以文本清单发送；「/开启解析」「/关闭解析」开关当前会话的解析；「/短链验证」自检短链服务是否可用；「/登录B站」扫码登录 B 站；「/相册 + 相册名 + 链接」（如「/相册旅游 + 链接」）把解析出的图片和视频直接存进同名群相册，只回一条上传结果、不往群里发媒体，不写相册名时用配置项「默认相册名称」（默认「少女集」）；「/全部相册 + 相册名 + 主页链接」（如「/全部相册旅游 + 主页链接」）把该主页的每个作品逐个存进同一个相册，**一个作品在相册里成一条**（同一作品的多张图合并成一条说说，视频因协议限制各自成贴），命令开头与结尾各回一条、中间不刷屏，单个作品解析失败或上传报错只记一笔并继续，完成后汇总「x/y 个作品已传进相册」与失败明细（最多 10 条）；条数默认取配置项「主页作品条数」、可用数字参数覆盖（如「/全部相册旅游 10 + 主页链接」），上限 50（每个作品都要完整下载一遍媒体）。作品文案写到相册评论里（相册条目描述在协议层写不了）；评论按 lloc 精确定位到本次上传的那条说说，参数形状与 NapCat ≤ v4.18.38 的 payloadSchema 一致（lloc 必填、无 batch_id），不会再被协议端的 Schema 校验打回；拿不到 lloc 时才退到按批次评论（NapCat 2026-10-12 之后的新版才有）；NapCat ≤ v4.18.38 的原生层还有一处上游 bug（评论体缺 QQNT 必需的 like 字段，NapNeko/NapCatQQ#1979），遇到会直接把原因和 issue 号说清楚而不是甩一串 Schema 报错；「/相册自检」会实发一次评论请求并打印相册媒体列表的原始字段。「/相册列表」列出群内相册名；「/创建相册 + 名字」新建相册（群主、群管理员与相册所有者可用）；「/删除相册 + 名字」删除相册（仅相册所有者本人，走精确同名匹配）。建/删相册优先走协议端的相册接口（候选 action 名 × 参数形状逐个探测，LLOneBot 的 create_group_album / delete_group_album 可直接命中）；NapCat 没有开放该接口时，会自动改走「原始发包」——按 QQ NT 内核 AlbumService 的定义拼出 trpc 请求（QunAlbum.trpc.qzone.webapp_qun_media.QunMedia.AddAlbum / DeleteAlbum），经 NapCat 的 send_packet 发出（需在 NapCat 配置里启用 packetBackend，未启用时回执会引用 NapCat 自己的报错并附文档链接）。无论走哪条路，建完/删完都会重新拉一次相册列表复核，接口假装成功判失败、绝不假装建好了；服务端返回的 retCode / retMsg 会解析出来写进回执。实在不可用时如实回报原因并给出手动步骤。以上清单与音频命令均支持可选的条数与发送方式参数，顺序不限：条数如「/全部 10 + 链接」（覆盖配置项的条数上限，最大 200）；发送方式可加「文件」或「语音」，如「/全部音乐 文件 10 + 主页链接」。直链在配置了短链服务（配置项「短链服务接口地址」「短链服务密码」）时会自动转成短链，短码按 36 进制由小到大递增，未配置则直接发送原始直链。所有命令的斜杠都可省略（「解析帮助」与「/解析帮助」等效），也不依赖面板「指令管理」里的指令开关，停用或改名都不会让命令失联。
